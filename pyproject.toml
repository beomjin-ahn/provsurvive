[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "provsurvive"
version = "1.0.0"
description = "Does image provenance (C2PA manifests, soft-binding watermarks) survive everyday edits, and at what quality cost?"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["C2PA", "content provenance", "soft binding", "watermarking", "benchmark", "image editing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "c2pa-python>=0.38",
    "trustmark>=0.9.2",
    "Pillow>=11.3",
    "numpy",
    "scikit-image",
    "lpips",
    "cryptography",
    "pydantic>=2",
    "typer",
    "pyyaml",
    "requests",
    "opencv-python-headless",
]

[project.optional-dependencies]
gen = ["diffusers>=0.40", "transformers", "accelerate"]
iscc = ["iscc-core>=1.4"]
# PixelSeal: install videoseal from a checkout pinned to VIDEOSEAL_COMMIT (see bindings/pixelseal.py)
pixelseal = ["omegaconf", "einops", "safetensors", "pytorch_msssim", "PyWavelets", "timm==0.9.16", "av", "pycocotools", "decord"]
dev = ["pytest", "ruff", "jsonschema"]

[project.scripts]
provsurvive = "provsurvive.cli:app"

[project.urls]
Homepage = "https://github.com/beomjin-ahn/provsurvive"

[tool.hatch.build.targets.wheel]
packages = ["src/provsurvive"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: loads ML models (TrustMark, LPIPS)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # typer.Option in defaults is the typer idiom
